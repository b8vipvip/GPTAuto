name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gptauto-release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid semver tag: $tag"; exit 1; }
          git rev-parse "$tag^{commit}" >/dev/null 2>&1 || { echo "::error::Tag does not exist: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q gptauto
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "GPTAuto $TAG" --generate-notes
          fi
