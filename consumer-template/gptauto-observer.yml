name: GPTAuto Observer
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reconcile
        required: false
      head_sha:
        description: Event/merge SHA to reconcile
        required: false
      merge_sha:
        description: Merge SHA to reconcile
        required: false
      main_ci_run_id:
        description: Successful post-merge CI run ID verified by reconciler
        required: false
      release_run_id:
        description: Successful Release run ID verified by reconciler
        required: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches:
      - main
      - master
  # Control-plane workflows are deliberately excluded from workflow_run.
  workflow_run:
    workflows: [CI]
    types: [completed]
  release:
    types: [published]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: gptauto-observer-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.release.id || github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify product evidence ingress
        id: ingress
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.workflow_run.pull_requests[0].base.ref || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          actionable=false
          case "$EVENT_NAME" in
            workflow_dispatch|release) actionable=true ;;
            pull_request)
              # GPTAuto owns autonomous completion only for PRs targeting the
              # repository default branch. Branch-to-branch sync/backport PRs are
              # auxiliary evidence and must never become competing merge tasks.
              [[ "$PR_BASE_REF" == "$DEFAULT_BRANCH" ]] && actionable=true
              ;;
            push)
              [[ "$ACTOR" != "github-actions[bot]" ]] && actionable=true
              ;;
            workflow_run)
              if [[ "$WORKFLOW_NAME" == "CI" && "$WORKFLOW_CONCLUSION" != "cancelled" ]]; then
                if [[ -n "$PR_BASE_REF" && "$PR_BASE_REF" != "$DEFAULT_BRANCH" ]]; then
                  actionable=false
                elif [[ "$WORKFLOW_CONCLUSION" != "success" || "$WORKFLOW_BRANCH" != "$DEFAULT_BRANCH" ]]; then
                  actionable=true
                fi
              fi
              ;;
          esac
          echo "actionable=$actionable" >> "$GITHUB_OUTPUT"
          if [[ "$actionable" != "true" ]]; then
            echo "::notice::GPTAuto Observer accepted a non-actionable or auxiliary product event as a successful no-op; no Executor will be scheduled."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.ingress.outputs.actionable == 'true' }}
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: ${{ steps.ingress.outputs.actionable == 'true' }}
        with:
          python-version: '3.12'
      - name: Capture repository-side GPTAuto task
        if: ${{ steps.ingress.outputs.actionable == 'true' }}
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_STATE: ${{ github.event.pull_request.state || '' }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
          MERGE_SHA: ${{ inputs.merge_sha || github.event.pull_request.merge_commit_sha || '' }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RECONCILED_MAIN_CI_RUN_ID: ${{ inputs.main_ci_run_id || '' }}
          RECONCILED_RELEASE_RUN_ID: ${{ inputs.release_run_id || '' }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_STATE: ${{ github.event.action || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          EXECUTOR_ELIGIBLE=true

          if [[ "$EVENT_NAME" == "release" && -n "$RELEASE_TAG" ]]; then
            git fetch --tags --force origin
            resolved="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
            [[ -n "$resolved" ]] && HEAD_SHA="$resolved"
          fi

          if [[ -z "$PR_NUMBER" && "$HEAD_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            PR_NUMBER="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null)][0].number // .[0].number // empty' 2>/dev/null || true)"
          fi

          PR_HEAD_SHA=""
          PR_CI_CONCLUSION=""
          PR_CI_RUN_ID=""
          MAIN_CI_CONCLUSION=""
          MAIN_CI_RUN_ID=""
          RELEASE_CONCLUSION=""
          RELEASE_RUN_ID=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$RECONCILED_MAIN_CI_RUN_ID" ]]; then
              MAIN_CI_RUN_ID="$RECONCILED_MAIN_CI_RUN_ID"
              MAIN_CI_CONCLUSION="success"
            fi
            if [[ -n "$RECONCILED_RELEASE_RUN_ID" ]]; then
              RELEASE_RUN_ID="$RECONCILED_RELEASE_RUN_ID"
              RELEASE_CONCLUSION="success"
            fi
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            PR_TITLE="$(jq -r '.title // ""' <<<"$pr_json")"
            PR_BODY="$(jq -r '.body // ""' <<<"$pr_json")"
            PR_STATE="$(jq -r '.state // ""' <<<"$pr_json")"
            PR_MERGED="$(jq -r 'if .merged_at then "true" else "false" end' <<<"$pr_json")"
            MERGE_SHA="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
            PR_HEAD_SHA="$(jq -r '.head.sha // ""' <<<"$pr_json")"
            PR_BASE_REF="$(jq -r '.base.ref // ""' <<<"$pr_json")"

            if [[ -n "$PR_BASE_REF" && "$PR_BASE_REF" != "$DEFAULT_BRANCH" ]]; then
              EXECUTOR_ELIGIBLE=false
              echo "::notice::PR #$PR_NUMBER targets $PR_BASE_REF instead of $DEFAULT_BRANCH; treating it as auxiliary evidence with merge_authority=false."
            fi

            if [[ -n "$PR_HEAD_SHA" ]]; then
              # Bind PR_CI to the latest CI pull_request run for this exact head.
              # Never allow an older green rerun to mask a newer queued/running or
              # failed generation on the same SHA.
              pr_runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$PR_HEAD_SHA&per_page=100" 2>/dev/null || echo '{"workflow_runs":[]}')"
              pr_ci_row="$(jq -c '[.workflow_runs[] | select(.name == "CI" and .event == "pull_request")] | sort_by(.created_at, .id) | last // {}' <<<"$pr_runs")"
              PR_CI_RUN_ID="$(jq -r '.id // empty' <<<"$pr_ci_row")"
              pr_ci_status="$(jq -r '.status // empty' <<<"$pr_ci_row")"
              pr_ci_conclusion="$(jq -r '.conclusion // empty' <<<"$pr_ci_row")"
              if [[ "$pr_ci_status" == "completed" && "$pr_ci_conclusion" == "success" ]]; then
                PR_CI_CONCLUSION="success"
              fi
            fi
            if [[ "$PR_MERGED" == "true" && -n "$MERGE_SHA" ]]; then
              MAIN_CI_RUN_ID="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&status=success&per_page=50" \
                --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")][0].id // empty' 2>/dev/null || true)"
              [[ -n "$MAIN_CI_RUN_ID" ]] && MAIN_CI_CONCLUSION="success"
              RELEASE_RUN_ID="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&status=success&per_page=50" \
                --jq '[.workflow_runs[] | select(.name == "Release" and .conclusion == "success")][0].id // empty' 2>/dev/null || true)"
            fi
          fi

          TASK_ID="$(PYTHONPATH=.github python -c 'from gptauto.observer import observed_task_id; import os; print(observed_task_id(os.environ["REPOSITORY"], os.environ.get("PR_NUMBER",""), os.environ.get("HEAD_SHA",""), os.environ.get("MERGE_SHA","")))' )"
          previous_artifact_id="$(gh api "repos/$REPOSITORY/actions/artifacts?name=gptauto-$TASK_ID&per_page=10" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
          if [[ -n "$previous_artifact_id" ]]; then
            mkdir -p ".gptauto/logs/$TASK_ID"
            gh api "repos/$REPOSITORY/actions/artifacts/$previous_artifact_id/zip" > /tmp/gptauto-previous.zip
            unzip -qo /tmp/gptauto-previous.zip -d ".gptauto/logs/$TASK_ID"
          fi

          PYTHONPATH=.github python -m gptauto.observer capture \
            --event "$EVENT_NAME" --repo "$REPOSITORY" --default-branch "$DEFAULT_BRANCH" \
            --branch "$REF_NAME" --head-sha "$HEAD_SHA" --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" --pr-body "$PR_BODY" --pr-state "$PR_STATE" --pr-merged "$PR_MERGED" \
            --merge-sha "$MERGE_SHA" --run-id "$RUN_ID" --actor "$ACTOR" \
            --workflow-name "$WORKFLOW_NAME" --workflow-conclusion "$WORKFLOW_CONCLUSION" \
            --release-tag "$RELEASE_TAG" --release-state "$RELEASE_STATE" \
            --pr-ci-conclusion "$PR_CI_CONCLUSION" --pr-ci-run-id "$PR_CI_RUN_ID" \
            --main-ci-conclusion "$MAIN_CI_CONCLUSION" --main-ci-run-id "$MAIN_CI_RUN_ID" \
            --release-conclusion "$RELEASE_CONCLUSION" --release-run-id "$RELEASE_RUN_ID" \
            --current-pr-head-sha "$PR_HEAD_SHA" > observer-result.json
          cat observer-result.json
          task_id="$(python -c 'import json;print(json.load(open("observer-result.json"))["task_id"])')"
          generation="$(python -c 'import json;print(json.load(open("observer-result.json"))["generation"])')"
          dispatch_head="${PR_HEAD_SHA:-$HEAD_SHA}"
          echo "task-id=$task_id" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "head-sha=$dispatch_head" >> "$GITHUB_OUTPUT"
          echo "executor-eligible=$EXECUTOR_ELIGIBLE" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/upload-gptauto-log
        if: ${{ steps.ingress.outputs.actionable == 'true' }}
        with:
          task-id: ${{ steps.capture.outputs.task-id }}
          retention-days: '30'
      - name: Dispatch canonical Executor handoff
        if: ${{ steps.ingress.outputs.actionable == 'true' && steps.capture.outputs.executor-eligible == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OBSERVER_RUN_ID: ${{ github.run_id }}
          TASK_ID: ${{ steps.capture.outputs.task-id }}
          GENERATION: ${{ steps.capture.outputs.generation }}
          HEAD_SHA: ${{ steps.capture.outputs.head-sha }}
        shell: bash
        run: |
          gh api --method POST "repos/$REPOSITORY/dispatches" \
            -f event_type='gptauto_observation' \
            -F "client_payload[observer_run_id]=$OBSERVER_RUN_ID" \
            -F "client_payload[task_id]=$TASK_ID" \
            -F "client_payload[generation]=$GENERATION" \
            -F "client_payload[head_sha]=$HEAD_SHA"
          echo "Explicit Executor handoff emitted for task=$TASK_ID generation=$GENERATION head=$HEAD_SHA observer=$OBSERVER_RUN_ID."
      - name: Summary
        if: ${{ steps.ingress.outputs.actionable == 'true' }}
        env:
          TASK_ID: ${{ steps.capture.outputs.task-id }}
          EXECUTOR_ELIGIBLE: ${{ steps.capture.outputs.executor-eligible }}
        run: |
          {
            echo "## GPTAuto repository observation"
            echo "- Task ID: \`$TASK_ID\`"
            echo "- Artifact: \`gptauto-$TASK_ID\`"
            echo "- Provenance: \`repository_observer\`"
            echo "- Executor eligible: \`$EXECUTOR_ELIGIBLE\`"
            echo "- PR CI evidence is the latest exact-head CI/pull_request run; older success cannot mask a newer run."
            echo "- Non-default-base PRs are auxiliary evidence only and never receive autonomous merge authority."
            echo "- A merged PR is VERIFY, not DONE; Release workflow success alone never proves publication."
          } >> "$GITHUB_STEP_SUMMARY"
