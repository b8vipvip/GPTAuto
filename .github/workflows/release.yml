name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional vMAJOR.MINOR.PATCH tag; defaults to pyproject version
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: gptauto-release
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve canonical release version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          configured="${{ inputs.tag }}"
          if [[ -n "$configured" ]]; then
            tag="$configured"
          else
            version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml","rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
            tag="v$version"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid semver tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q gptauto

      - name: Prepare exact release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            tagged="$(git rev-parse "$TAG^{commit}")"
            [[ "$tagged" == "$SHA" ]] || { echo "::error::Tag $TAG points to $tagged, expected $SHA"; exit 1; }
          else
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists at the exact commit; consumer fan-out is already complete for this published release."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fan out release to registered consumers
        if: steps.tag.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_GITHUB_TOKEN || secrets.GPTAUTO_CONSUMER_TOKEN || secrets.GPTAUTO_SYNC_TOKEN || secrets.GPTAUTO_EXECUTOR_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GPTAUTO_GITHUB_TOKEN is required for cross-repository release fan-out. Legacy GPTAUTO_CONSUMER_TOKEN / GPTAUTO_SYNC_TOKEN / GPTAUTO_EXECUTOR_TOKEN remain accepted during migration. A new GPTAuto release cannot complete until every registered consumer has been updated."
            exit 1
          fi

          python - <<'PY' > "$RUNNER_TEMP/gptauto-consumer-dispatch.tsv"
          from gptauto.consumer_sync.registry import ConsumerRegistry
          from gptauto.consumer_sync.release_dispatch import build_release_dispatch_plan
          import os

          registry = ConsumerRegistry('.gptauto/consumers.json')
          plan = build_release_dispatch_plan(
              [item.__dict__ for item in registry.sync_candidates()],
              os.environ['TAG'],
          )
          for item in plan:
              print(f"{item.repository}\t{item.event}\t{item.version}")
          PY

          dispatched=0
          bootstrapped=0
          while IFS=$'\t' read -r repository event version; do
            [[ -n "$repository" ]] || continue

            sync_workflow="$(gh api "repos/$repository/contents/.github/workflows/gptauto-sync.yml" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)"
            has_release_listener=false
            if grep -q '^  repository_dispatch:' <<<"$sync_workflow"; then
              has_release_listener=true
            fi

            payload="$(jq -nc \
              --arg event "$event" \
              --arg version "$version" \
              --arg source_repository "$SOURCE_REPOSITORY" \
              --arg source_sha "$SOURCE_SHA" \
              '{event_type:$event,client_payload:{version:$version,source_repository:$source_repository,source_sha:$source_sha}}')"
            echo "Dispatching $event $version -> $repository"
            gh api --method POST "repos/$repository/dispatches" --input - <<<"$payload"
            dispatched=$((dispatched + 1))

            if [[ "$has_release_listener" != "true" ]]; then
              echo "Legacy consumer listener detected; bootstrapping once with workflow_dispatch -> $repository"
              gh workflow run gptauto-sync.yml --repo "$repository" -f operation=sync
              bootstrapped=$((bootstrapped + 1))
            fi
          done < "$RUNNER_TEMP/gptauto-consumer-dispatch.tsv"

          {
            echo "## GPTAuto release-driven consumer fan-out"
            echo "- Target: $TAG"
            echo "- repository_dispatch requests: $dispatched"
            echo "- legacy one-time bootstraps: $bootstrapped"
            echo "- Periodic version polling: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require registered consumers to install release
        if: steps.tag.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_GITHUB_TOKEN || secrets.GPTAUTO_CONSUMER_TOKEN || secrets.GPTAUTO_SYNC_TOKEN || secrets.GPTAUTO_EXECUTOR_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::Cross-repository token is required for the consumer completion gate."; exit 1; }

          target_version="${TAG#v}"
          python - <<'PY' > "$RUNNER_TEMP/gptauto-consumers.txt"
          from gptauto.consumer_sync.registry import ConsumerRegistry
          for item in ConsumerRegistry('.gptauto/consumers.json').sync_candidates():
              print(item.repository)
          PY

          if [[ ! -s "$RUNNER_TEMP/gptauto-consumers.txt" ]]; then
            echo "No active auto-sync consumers are registered."
            exit 0
          fi

          max_attempts=80
          for attempt in $(seq 1 "$max_attempts"); do
            all_done=true
            terminal_failure=false

            while IFS= read -r repository; do
              [[ -n "$repository" ]] || continue
              default_branch="$(gh api "repos/$repository" --jq '.default_branch')"
              installed="$(gh api "repos/$repository/contents/.github/gptauto/VERSION?ref=$default_branch" --jq '.content // ""' 2>/dev/null | base64 --decode 2>/dev/null | tr -d '\r\n' || true)"

              if [[ "$installed" == "$target_version" ]]; then
                continue
              fi

              all_done=false
              sync_branch="chore/gptauto-sync-v$target_version"
              pr_json="$(gh pr list --repo "$repository" --state all --head "$sync_branch" --limit 1 --json number,state,mergedAt,headRefOid,url 2>/dev/null || printf '[]')"
              pr_number="$(jq -r '.[0].number // empty' <<<"$pr_json")"
              pr_state="$(jq -r '.[0].state // empty' <<<"$pr_json")"
              pr_merged_at="$(jq -r '.[0].mergedAt // empty' <<<"$pr_json")"
              pr_head_sha="$(jq -r '.[0].headRefOid // empty' <<<"$pr_json")"

              if [[ "$pr_state" == "CLOSED" && -z "$pr_merged_at" ]]; then
                echo "::error::$repository sync PR #$pr_number was closed without merge; installed=${installed:-not-installed}, target=$target_version"
                terminal_failure=true
                continue
              fi

              if [[ -n "$pr_head_sha" ]]; then
                checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$repository/commits/$pr_head_sha/check-runs?per_page=100" 2>/dev/null || printf '{"check_runs":[]}')"
                failed="$(jq '[.check_runs[]? | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "stale" or .conclusion == "startup_failure"))] | length' <<<"$checks")"
                if [[ "$failed" -gt 0 ]]; then
                  echo "::error::$repository sync PR #$pr_number has $failed failed terminal check(s); target=$target_version"
                  terminal_failure=true
                fi
              fi
            done < "$RUNNER_TEMP/gptauto-consumers.txt"

            if [[ "$terminal_failure" == "true" ]]; then
              exit 1
            fi

            if [[ "$all_done" == "true" ]]; then
              {
                echo "## Consumer completion gate"
                echo "- Target: $TAG"
                echo "- Result: every registered active consumer is on $target_version"
                echo "- Further periodic version checks: none"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if (( attempt % 4 == 0 )); then
              echo "Waiting for consumer sync PR/CI/merge completion ($attempt/$max_attempts)..."
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for all registered consumers to install $TAG. The GitHub Release was not published."
          while IFS= read -r repository; do
            [[ -n "$repository" ]] || continue
            default_branch="$(gh api "repos/$repository" --jq '.default_branch')"
            installed="$(gh api "repos/$repository/contents/.github/gptauto/VERSION?ref=$default_branch" --jq '.content // ""' 2>/dev/null | base64 --decode 2>/dev/null | tr -d '\r\n' || true)"
            echo "::error::$repository installed=${installed:-not-installed}, target=$target_version"
          done < "$RUNNER_TEMP/gptauto-consumers.txt"
          exit 1

      - name: Publish exact release after consumer convergence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tagged="$(git rev-parse "$TAG^{commit}")"
          [[ "$tagged" == "$SHA" ]] || { echo "::error::Tag $TAG moved to $tagged, expected $SHA"; exit 1; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published."
          else
            gh release create "$TAG" --verify-tag --title "GPTAuto $TAG" --generate-notes --target "$SHA"
          fi

          {
            echo "## GPTAuto release"
            echo "- Published: $TAG"
            echo "- Commit: $SHA"
            echo "- Consumer synchronization: completed before publication"
          } >> "$GITHUB_STEP_SUMMARY"
