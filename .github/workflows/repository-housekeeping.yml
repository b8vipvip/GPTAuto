name: Repository Housekeeping
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gptauto-repository-housekeeping
  cancel-in-progress: true
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prune stale branches when explicitly enabled
        env:
          GPTAUTO_AGGRESSIVE_BRANCH_PRUNE: ${{ vars.GPTAUTO_AGGRESSIVE_BRANCH_PRUNE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GPTAUTO_AGGRESSIVE_BRANCH_PRUNE" == true ]] || { echo "Aggressive branch pruning disabled"; exit 0; }
          default="${{ github.event.repository.default_branch }}"; cutoff="$(date -u -d '7 days ago' +%s)"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"; [[ "$branch" == HEAD || "$branch" == "$default" ]] && continue
            tip="$(git log -1 --format=%ct "$ref")"
            if (( tip < cutoff )); then echo "DELETE $branch"; git push origin --delete "$branch" || echo "::warning::Unable to delete $branch"; fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
